name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Scoped to the code that is currently lint-clean and testable.
  # cloud/ has pre-existing black/flake8/mypy findings and tests whose imports
  # do not resolve; widen these paths as those are cleaned up.

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ml/mri_analysis/requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/mri_analysis/requirements-ci.txt
      - name: Run unit tests
        run: pytest tests/unit/test_mri_analysis.py -v --cov=ml/mri_analysis --cov-report=term-missing

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx requests
      - name: Run integration tests
        run: pytest tests/integration/test_services_integration.py -v

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run E2E tests
        run: pytest tests/e2e/ -v

  # Load test needs the full compose stack, which is not buildable yet
  # (only some services have Dockerfiles); run on demand.
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install locust pytest-benchmark
      - name: Start services
        run: |
          docker compose -f cloud/docker-compose.yml up -d
          sleep 30
      - name: Run performance tests
        run: locust -f tests/performance/locustfile.py --headless -u 100 -r 10 -t 60s
      - name: Stop services
        if: always()
        run: docker compose -f cloud/docker-compose.yml down

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Bandit on MRI module
        run: |
          pip install bandit
          bandit -r ml/mri_analysis
      - name: Audit MRI module dependencies
        run: |
          pip install pip-audit
          pip-audit -r ml/mri_analysis/requirements-ci.txt
      - name: Bandit report for cloud/ (informational)
        run: |
          bandit -r cloud/ -f txt --exit-zero | tail -25

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install linting tools
        run: pip install black flake8 mypy numpy scipy
      - name: Run Black
        run: black --check ml/mri_analysis tests/unit/test_mri_analysis.py
      - name: Run Flake8
        run: flake8 ml/mri_analysis tests/unit/test_mri_analysis.py --max-line-length=100 --extend-ignore=E203
      - name: Run MyPy
        run: mypy ml/mri_analysis --ignore-missing-imports

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        # only services that have a Dockerfile
        service:
          - user-management
          - data-collection
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: cloud/services/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache,mode=max
