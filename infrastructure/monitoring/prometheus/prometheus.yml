# Prometheus Configuration
# تنظیمات Prometheus برای APM

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ms-neuroplatform'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # User Management Service
  - job_name: 'user-management'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-management:8001']
        labels:
          service: 'user-management'
          environment: 'production'

  # Data Collection Service
  - job_name: 'data-collection'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-collection:8002']
        labels:
          service: 'data-collection'
          environment: 'production'

  # ML Inference Service
  - job_name: 'ml-inference'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-inference:8003']
        labels:
          service: 'ml-inference'
          environment: 'production'

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000']
        labels:
          service: 'api-gateway'
          environment: 'production'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          environment: 'production'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          environment: 'production'

